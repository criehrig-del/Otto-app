<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f2"><link rel="manifest" href="manifest.webmanifest"><title>OTTO – Dein Assistent</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#242b30;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:690px;margin:auto;padding:28px 20px 110px}header{display:flex;align-items:center;gap:12px;margin-bottom:45px}.logo{background:#263e48;color:white;border-radius:16px;width:48px;height:48px;display:grid;place-items:center;font-size:25px;font-weight:800}h1{font-size:25px;margin:0}small,.muted{color:#737b7c}.date{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700}.greeting{font-size:34px;letter-spacing:-.04em;margin:12px 0 5px}.card{background:white;border:1px solid #e9e8e3;border-radius:22px;padding:22px;margin:26px 0;box-shadow:0 6px 20px #172c3210}.card h2{font-size:17px;margin:0 0 15px}.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f1f0ed}.task:last-child{border:0}.task input{accent-color:#263e48;width:19px;height:19px}.task.done span{text-decoration:line-through;color:#9b9e9d}.talk{text-align:center;padding:25px 0 12px}.mic{width:90px;height:90px;border-radius:50%;border:0;background:#263e48;color:white;font-size:38px;cursor:pointer}.mic.active{background:#b45c4f}.status{font-size:14px;color:#737b7c;min-height:22px;margin-top:12px}.composer{display:flex;gap:8px;margin-top:20px}.composer input{min-width:0;flex:1;border:1px solid #dddeda;border-radius:18px;padding:17px;font-size:16px}.composer button{border:0;background:#263e48;color:white;border-radius:16px;padding:0 20px;font-size:22px}.messages{margin-top:20px;display:grid;gap:12px}.message{padding:13px 16px;border-radius:16px;background:#e8eeed;line-height:1.5}.message.user{background:#fff;margin-left:35px}.notice{font-size:12px;color:#767c7d;margin-top:28px;line-height:1.6}button{cursor:pointer}@media(min-width:750px){.shell{padding-top:60px}}</style></head><body><main class="shell"><header><div class="logo">O</div><div><h1>OTTO</h1><small>Dein persönlicher Assistent</small></div></header><div class="date" id="date"></div><h2 class="greeting" id="greeting">Guten Morgen!</h2><div class="muted">Das steht heute an.</div><section class="card"><h2>Dein Tagesüberblick</h2><div id="tasks"></div></section><section class="talk"><button class="mic" id="mic" aria-label="Spracheingabe starten">🎙</button><div class="status" id="status">Sprich mit OTTO</div></section><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Oder schreibe OTTO …" aria-label="Nachricht an OTTO"><button aria-label="Senden">↑</button></form><div class="messages" id="messages" aria-live="polite"></div><p class="notice">Prototyp: Aufgaben werden nur auf diesem Gerät gespeichert. Notion, Gmail, Kalender und eine KI-Verbindung sind noch nicht angebunden. OTTO versendet keine E-Mails.</p></main><script>const $=id=>document.getElementById(id);const key='otto-tasks-v1';let tasks=JSON.parse(localStorage.getItem(key)||'null')||[{text:'Angela – Journal fixe absagen',done:false},{text:'Schmidtmedia – Podcast vorbereiten',done:false},{text:'Offene Aufgaben und Termine prüfen',done:false}];function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}function render(){$('tasks').replaceChildren();tasks.forEach((t,i)=>{let row=document.createElement('label');row.className='task'+(t.done?' done':'');let c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.onchange=()=>{tasks[i].done=c.checked;save()};let span=document.createElement('span');span.textContent=t.text;row.append(c,span);$('tasks').append(row)})}render();let now=new Date();$('date').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(now);let h=now.getHours();$('greeting').textContent=h<11?'Guten Morgen!':h<18?'Guten Tag!':'Guten Abend!';function msg(text,user=false){let d=document.createElement('div');d.className='message'+(user?' user':'');d.textContent=text;$('messages').prepend(d)}function process(text){text=text.trim();if(!text)return;msg(text,true);let m=text.match(/^(?:otto[,!]?\s*)?(?:erinnere mich (?:daran[, ]*)?|setz(?:e)? (?:bitte )?(?:auf (?:die )?liste )?|notiere (?:bitte )?|füge (?:bitte )?(?:die aufgabe )?hinzu[: ]*|ich muss )(.+)/i);if(m){tasks.push({text:m[1].replace(/[.!]$/,''),done:false});save();msg('Ich habe die Aufgabe hier im lokalen Tagesüberblick ergänzt. Sie ist noch nicht in Notion gespeichert.')}else if(/(?:was|welche).*(?:heute|aufgaben|ansteht)/i.test(text)){msg(tasks.filter(t=>!t.done).length?'Aktuell offen: '+tasks.filter(t=>!t.done).map(t=>t.text).join('; ')+'.':'Hier sind alle Aufgaben erledigt.')}else{msg('Ich habe deine Nachricht verstanden, kann sie aber noch nicht zuverlässig ausführen. Für die echte Assistenz fehlen noch die KI- und Notion-Anbindungen.')} }$('form').onsubmit=e=>{e.preventDefault();let t=$('input').value;$('input').value='';process(t)};let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(Recognition){let rec=new Recognition();rec.lang='de-DE';rec.onstart=()=>{$('mic').classList.add('active');$('status').textContent='Ich höre zu …'};rec.onend=()=>{$('mic').classList.remove('active');$('status').textContent='Sprich mit OTTO'};rec.onresult=e=>process(e.results[0][0].transcript);rec.onerror=e=>{$('status').textContent='Spracherkennung nicht verfügbar: '+e.error};$('mic').onclick=()=>rec.start()}else{$('mic').onclick=()=>{$('status').textContent='Spracherkennung wird von diesem Browser nicht unterstützt. Bitte Texteingabe verwenden.'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
